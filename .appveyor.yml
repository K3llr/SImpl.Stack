# configuration for "master" branch
-
  branches:
    only:
      - master
      - v2/master
  configuration: Release
  before_build:
    - ps: nuget restore .\src\SImpl.Stack.sln
  image: Visual Studio 2022
  build:
    publish_nuget: true
    project: .\src\SImpl.Stack.sln
  
  deploy:
    provider: NuGet
    api_key:
      secure: we7jRCpbgBtfJ7UAuu5CnF2E2VD3yEEFoC2rB7IM2bjR9sGIobKgZ0ADzf6TfoLG
    skip_symbols: false
    artifact: /.*(\.|\.s)nupkg/
